<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Character Controller</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #instructions {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #fff;
      font-family: sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 15px;
      border-radius: 6px;
      pointer-events: none;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="instructions">
    <strong>Controls:</strong><br>
    W / A / S / D or Arrow Keys: Walk<br>
    Hold Shift + Movement: Sprint<br>
    Spacebar: Jump<br>
    E Key: Attack<br>
    Mouse Drag: Rotate Camera
  </div>

  <script src="palette.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, Camera, Renderer Setup
    const container = document.getElementById('canvas-container');
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(palette[0]);

    const camera = new THREE.PerspectiveCamera(
      60, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // 2. Mouse Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Lighting & Floor
    const ambientLight = new THREE.AmbientLight(palette[12], 1.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(palette[12], 2.5);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const gridHelper = new THREE.GridHelper(20, 20, palette[10], palette[9]);
    scene.add(gridHelper);

    // State & Variables
    let characterModel;
    let mixer;
    let actions = {};
    let activeAction;
    
    const clock = new THREE.Clock();

    const moveState = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      shift: false
    };

    // Physics & Action Flags
    const walkSpeed = 3.5;
    const sprintSpeed = 6.5;
    
    let verticalVelocity = 0;
    const gravity = 30;
    const jumpForce = 10;
    let isJumping = false;
    let isAttacking = false;

    // 4. Keyboard Input Handlers
    window.addEventListener('keydown', (e) => handleKey(e, true));
    window.addEventListener('keyup', (e) => handleKey(e, false));

    function handleKey(e, isPressed) {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          moveState.forward = isPressed;
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          moveState.backward = isPressed;
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          moveState.left = isPressed;
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          moveState.right = isPressed;
          break;
        case 'Shift':
          moveState.shift = isPressed;
          break;
        case ' ':
          if (isPressed && !isJumping && !isAttacking) {
            triggerJump();
          }
          break;
        case 'e':
        case 'E':
          if (isPressed && !isAttacking && !isJumping) {
            triggerAttack();
          }
          break;
      }
    }

    function triggerJump() {
      isJumping = true;
      verticalVelocity = jumpForce;
      fadeToAction('jump', 0.1);
    }

    function triggerAttack() {
      // Make sure the action exists before executing
      if (!actions['attack']) {
        console.warn("Attack animation clip not found in model.glb! Check your clip names.");
        return;
      }
      isAttacking = true;
      fadeToAction('attack', 0.1);
    }

    // 5. Load Texture & GLB Model
    const textureLoader = new THREE.TextureLoader();
    const externalTexture = textureLoader.load('texture.png', (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
    });

    const loader = new GLTFLoader();
    loader.load(
      'model.glb',
      (gltf) => {
        characterModel = gltf.scene;

        characterModel.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.map = externalTexture;
            child.material.needsUpdate = true;
          }
        });

        // Center origin offset
        const box = new THREE.Box3().setFromObject(characterModel);
        const center = box.getCenter(new THREE.Vector3());
        characterModel.position.x -= center.x;
        characterModel.position.y -= center.y;
        characterModel.position.z -= center.z;

        scene.add(characterModel);

        // Setup Animations
        const animations = gltf.animations;
        if (animations && animations.length > 0) {
          mixer = new THREE.AnimationMixer(characterModel);

          // List all possible clip variations to check against
          const clipNames = ['idle', 'walk', 'sprint', 'jump', 'attack'];
          clipNames.forEach((name) => {
            let clip = THREE.AnimationClip.findByName(animations, name);
            
            // Fallback matching if exact lowercase name differs (e.g., "Attack" or "Armature|attack")
            if (!clip) {
              clip = animations.find(anim => anim.name.toLowerCase().includes(name));
            }

            if (clip) {
              const action = mixer.clipAction(clip);
              if (name === 'jump' || name === 'attack') {
                action.setLoop(THREE.LoopOnce);
                action.clampWhenFinished = true;
              }
              actions[name] = action;
            }
          });

          if (!actions['idle'] && animations[0]) {
            actions['idle'] = mixer.clipAction(animations[0]);
          }

          activeAction = actions['idle'];
          if (activeAction) activeAction.play();

          // Event listener to automatically unlock state when 'attack' or 'jump' completes
          mixer.addEventListener('finished', (e) => {
            if (e.action === actions['attack']) {
              isAttacking = false;
              const isMoving = moveState.forward || moveState.backward || moveState.left || moveState.right;
              if (isMoving) {
                fadeToAction(moveState.shift ? 'sprint' : 'walk', 0.2);
              } else {
                fadeToAction('idle', 0.2);
              }
            }
          });
        }
      },
      undefined,
      (error) => console.error('Error loading model:', error)
    );

    // Animation Blending Function
    function fadeToAction(name, duration) {
      const previousAction = activeAction;
      const targetAction = actions[name];

      if (!targetAction || previousAction === targetAction) return;

      activeAction = targetAction;

      if (previousAction) {
        previousAction.fadeOut(duration);
      }

      activeAction
        .reset()
        .setEffectiveTimeScale(1)
        .setEffectiveWeight(1)
        .fadeIn(duration)
        .play();
    }

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. Main Game Loop
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (characterModel) {
        // Horizontal Movement Logic (Completely frozen during attacks)
        const direction = new THREE.Vector3();
        if (!isAttacking) {
          if (moveState.forward) direction.z -= 1;
          if (moveState.backward) direction.z += 1;
          if (moveState.left) direction.x -= 1;
          if (moveState.right) direction.x += 1;
        }

        const isMoving = direction.lengthSq() > 0;
        const currentSpeed = moveState.shift ? sprintSpeed : walkSpeed;

        if (isMoving && !isAttacking) {
          direction.normalize();
          characterModel.position.x += direction.x * currentSpeed * delta;
          characterModel.position.z += direction.z * currentSpeed * delta;

          const targetAngle = Math.atan2(direction.x, direction.z);
          characterModel.rotation.y = targetAngle;
        }

        // Jump Physics Processing
        if (isJumping) {
          characterModel.position.y += verticalVelocity * delta;
          verticalVelocity -= gravity * delta;

          if (characterModel.position.y <= 0) {
            characterModel.position.y = 0;
            verticalVelocity = 0;
            isJumping = false; 

            if (isMoving) {
              fadeToAction(moveState.shift ? 'sprint' : 'walk', 0.15);
            } else {
              fadeToAction('idle', 0.15);
            }
          }
        } else if (!isAttacking) {
          // Ground Locomotion Animations
          if (isMoving) {
            fadeToAction(moveState.shift ? 'sprint' : 'walk', 0.2);
          } else {
            fadeToAction('idle', 0.2);
          }
        }

        // Camera Lock
        controls.target.copy(characterModel.position);
        controls.target.y += 1;
      }

      if (mixer) {
        mixer.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
